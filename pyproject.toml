[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-judge"
version = "0.1.0"
description = "Small TCP programming judge for a private LAN"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oj-server = "judge.server:main"
oj-client = "judge.client:main"

[tool.setuptools]
packages = ["judge"]

