[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-judge"
version = "0.1.0"
description = "Small TCP programming judge for a private LAN"
requires-python = ">=3.11"
dependencies = ["orjson>=3.10,<4"]

[project.scripts]
oj-server = "judge.server:main"
oj-client = "judge.client:main"
contest = "ott.__main__:main"

[tool.setuptools.packages.find]
include = ["core", "core.*", "judge", "judge.*", "mockup", "ott", "ott.*", "samples"]
namespaces = false

[tool.setuptools.package-data]
mockup = ["index.html", "styles.css", "app.js", "net.js", "runtime-config.js", "_headers", "assets/*.svg"]
"ott.docker" = ["Dockerfile.bot"]
samples = ["bot_template.cpp", "bot_template.c", "bot_template.rs", "bot_template.go", "bot_template.java"]

