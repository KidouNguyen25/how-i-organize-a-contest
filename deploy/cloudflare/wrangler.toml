# Demo 0đ: static assets + BFF. Triển khai: xem docs/minh/runbook-demo.md
name = "ott-arena-demo"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "../../mockup"
binding = "ASSETS"
not_found_handling = "none"
# Chỉ /api/* và runtime-config.js đi qua Worker; phần còn lại là static assets (không tính vào quota request).
run_worker_first = ["/api/*", "/runtime-config.js"]

[vars]
RUNTIME_MODE = "tunnel"
POLL_MS = "10000"
# PUBLIC_ORIGIN: URL công khai của Worker, ví dụ https://ott-arena-demo.<subdomain>.workers.dev (đặt sau lần deploy đầu)
PUBLIC_ORIGIN = ""
# ORIGIN_URL: URL Quick Tunnel hiện tại; đổi mỗi lần tạo lại tunnel (xem scripts/set-origin.sh)
ORIGIN_URL = ""
# ORIGIN_KEY là secret: wrangler secret put ORIGIN_KEY (không ghi vào file này)
