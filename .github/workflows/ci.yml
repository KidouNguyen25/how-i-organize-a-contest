name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python test suite
        run: python -m unittest discover -v

  cloudflare-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker tests when present
        run: |
          if [ -f deploy/cloudflare/package.json ]; then
            node --test deploy/cloudflare/test/*.test.mjs
          else
            echo "No Cloudflare Worker package in this change."
          fi
