name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the full API tournament end-to-end test
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install distribution
        run: python -m pip install --no-deps .
      - name: Check installed modules and entry points
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "from core.api_v2 import CoreAPIv2Controller; from core.adapters import BotAdapter, TestSuiteAdapter; from judge.server import JudgeService; from ott.api import make_app"
          python -I -c "from pathlib import Path; from ott.api import TEMPLATE_PATH; from ott.__main__ import WEB_ROOT, DOCKER_CONTEXT, ROOT; assert all((WEB_ROOT / name).is_file() for name in ('index.html','styles.css','themes.css','app.js','themes.js','net.js','runtime-config.js','assets/knight-tabler-MIT.svg')); assert all(TEMPLATE_PATH.with_name('bot_template' + ext).is_file() for ext in ('.cpp','.c','.rs','.go')); assert (DOCKER_CONTEXT / 'Dockerfile.bot').is_file(); assert ROOT == Path.cwd()"
          contest --help
          oj-server --help
          oj-client --help
      - name: Compile Python modules
        run: python -m compileall -q core judge ott tests
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

  docker-integration:
    name: Docker judge and sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build judge runner image
        run: docker build -f judge/Dockerfile.runner -t lan-judge-cpp17 .
      - name: Build judge runtime image
        run: docker build -f judge/Dockerfile.runner --target runtime -t lan-judge-runtime .
      - name: Build OTT compiler image
        run: python -m ott build-image --image ott-bot-runner
      - name: Build OTT runtime image
        run: python -m ott build-image --target runtime --image ott-bot-runtime
      - name: Require separate Linux compiler and runtime images
        run: |
          python - <<'PY'
          import asyncio
          from judge.judge_engine import DockerJudge
          from ott.sandbox import DockerSandbox

          sandbox = DockerSandbox(runtime_image="ott-bot-runtime")
          available, detail = sandbox.available()
          if not available or sandbox.compiler_image_id == sandbox.runtime_image_id:
              raise RuntimeError("OTT Docker integration prerequisites failed: " + detail)
          judge = DockerJudge("lan-judge-cpp17", "lan-judge-runtime")
          asyncio.run(judge.check_available())
          if judge.compiler_image_id == judge.runtime_image_id:
              raise RuntimeError("Judge compiler and runtime must use different images.")
          PY
      - name: Test Docker judge integration
        run: python -m unittest discover -s tests -p "test_docker_integration.py" -v
      - name: Test Docker sandbox integration
        run: python -m unittest discover -s tests -p "test_ott_sandbox.py" -v

  cloudflare-worker:
    name: Cloudflare Worker tests and dry-run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund --no-package-lock
        working-directory: deploy/cloudflare
      - name: Run Worker tests
        run: npm test
        working-directory: deploy/cloudflare
      - name: Validate Worker bundle
        run: npm exec -- wrangler deploy --dry-run --config wrangler.toml --outdir "$RUNNER_TEMP/wrangler-dry-run"
        working-directory: deploy/cloudflare

  e2e:
    name: Full API tournament end-to-end
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      - name: Seed isolated test accounts
        run: python -m ott seed --data "$RUNNER_TEMP/ott-e2e-data"
      - name: Start local API
        run: |
          python -m ott serve --profile development --runner local --data "$RUNNER_TEMP/ott-e2e-data" --move-delay-ms 0 --port 8080 > "$RUNNER_TEMP/ott-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ott-api.pid"
      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ott-api.log"
          exit 1
      - name: Play full sample tournament through the API
        run: python tests/e2e_api.py --data "$RUNNER_TEMP/ott-e2e-data"
